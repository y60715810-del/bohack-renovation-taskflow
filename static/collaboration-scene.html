<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四方协作过程</title>
<link rel="stylesheet" href="/static/collaboration-scene.css"></head><body>
<h1>把每一方的依据，放在一起。</h1><p>每一步都有具体的人，每一次确认都有记录。</p>
<div class="steps"><section class="step"><span>01 / 住户</span><h2>说出需求</h2><p>保留原话，明确想要改变的地方。</p></section><section class="step"><span>02 / 设计与施工</span><h2>补全依据</h2><p>核对图纸、材料、报价与到货日期。</p></section><section class="step"><span>03 / 中介协调</span><h2>共同确认</h2><p>指定责任人，各方确认同一版本。</p></section><section class="step"><span>04 / 施工与住户</span><h2>执行交付</h2><p>上传现场留痕，由住户最终验收。</p></section></div>
<div class="outcome"><p>先确认，再执行。修订后重新确认，交付由人验收。</p></div>
<button type="button" id="play">播放协作构建</button><button type="button" id="stop" hidden>跳过动画</button>
<script type="module" src="/static/collaboration-scene.js"></script></body></html>
